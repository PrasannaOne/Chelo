name = "chessling-arena"
main = "worker.mjs"
compatibility_date = "2026-11-19"

[[d1_databases]]
binding = "DB"
database_name = "chessling-arena"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Set CORS_ORIGIN to the deployed Chessling Pages origin before production use.
[vars]
CORS_ORIGIN = "https://YOUR-CHESSLING-PAGES-DOMAIN.pages.dev"
