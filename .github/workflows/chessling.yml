name: Install Chessling from Chess.zip

on:
  push:
    branches:
      - main
    paths:
      - Chess.zip
      - .github/workflows/chessling.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chessling-main-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract Chess.zip into repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f Chess.zip || { echo 'Chess.zip is missing from the repository root.'; exit 1; }
          STAGE="$RUNNER_TEMP/chessling-root"
          mkdir -p "$STAGE"
          unzip -q Chess.zip -d "$STAGE"
          test -f "$STAGE/index.html" || { echo 'Chess.zip must contain index.html at the ZIP root.'; exit 1; }
          test -f "$STAGE/brain.js" || { echo 'Chess.zip is missing brain.js.'; exit 1; }
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='Chess.zip' \
            "$STAGE/" ./

      - name: Validate JavaScript and run project tests
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js arena/*.mjs tests/*.js; do
            [ -f "$file" ] && node --check "$file"
          done
          bash run-tests.sh

      - name: Commit extracted project files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No extracted project changes to commit.'
          else
            git commit -m "Install Chessling project from Chess.zip"
            git push origin HEAD:main
          fi
          
